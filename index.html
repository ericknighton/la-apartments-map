<style>
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #map{position:absolute;inset:0}
  .tag{display:inline-block;white-space:nowrap;padding:3px 7px;border-radius:12px;font-size:12px;font-weight:700;color:#111;
       border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);transform:translate(-50%,-100%);position:relative;cursor:pointer;line-height:1.2}
  .tag:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-5px;border:5px solid transparent;border-top-color:inherit;border-bottom:0}
  .tag.removed{color:#fff;text-decoration:line-through;opacity:.95}
  .ref{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;padding:3px 8px;border-radius:6px;background:#1a237e;color:#fff;
       font-size:12px;font-weight:700;border:2px solid #ffd600;box-shadow:0 1px 4px rgba(0,0,0,.5);transform:translate(-50%,-50%)}
  .ref b{color:#ffd600;font-size:14px}
  .leaflet-div-icon{background:none;border:none}
  .sc{width:22px;height:22px;border-radius:50%;background:#111;border:2px solid #ffd600;box-shadow:0 1px 4px rgba(0,0,0,.5);
      display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;transform:translate(-50%,-50%);cursor:pointer}
  .sc.planned{background:#666;border-style:dashed;opacity:.85}
  .pop h3{margin:0 0 2px;font-size:15px}
  .pop .addr{color:#555;font-size:12px;margin-bottom:6px}
  .pop .price{font-size:16px;font-weight:700;margin-bottom:4px}
  .pop table{border-collapse:collapse;font-size:12px;width:100%}
  .pop td{padding:2px 4px;vertical-align:top;border-top:1px solid #eee}
  .pop td:first-child{color:#666;white-space:nowrap;width:1%}
  .pop .badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;color:#111;margin-bottom:4px;font-weight:700}
  .pop .badge.removed{color:#fff}
  .pop .feats{font-size:12px;margin:4px 0 6px;line-height:1.35}
  .pop .feats b{font-weight:700}
  .pop a.btn{display:inline-block;margin-top:8px;padding:6px 12px;background:#1a73e8;color:#fff!important;border-radius:6px;text-decoration:none;font-weight:600}
  .legend{background:rgba(255,255,255,.95);padding:8px 10px;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.3);font-size:12px;line-height:1.7}
  .legend .sw{display:inline-block;width:12px;height:12px;border-radius:6px;margin-right:6px;vertical-align:-1px;border:1px solid #ccc}
  .legend .t{font-weight:700;margin-bottom:2px}
  .leaflet-popup-content{margin:10px 12px}
  @media (max-width:600px){.legend{font-size:11px;padding:6px 8px}.tag{font-size:11px;padding:2px 6px}}
</style>

, Los Angeles, CA 90048", "lat": 34.074096, "lon": -118.37529, "stalls": 48, "kw": 250, "facility": null, "opened": null, "otherEVs": true, "source": "https://supercharge.info/map?siteID=6456"}, {"name": "Culver City, CA - La Cienega Blvd", "status": "PLAN", "address": "2901 La Cienega Blvd, Culver City, CA 90232", "lat": 34.032089, "lon": -118.374324, "stalls": 0, "kw": 500, "facility": null, "opened": null, "otherEVs": true, "source": "https://supercharge.info/map?siteID=12310"}, {"name": "Los Angeles, CA - Wilshire Blvd", "status": "PERMIT", "address": "6060 Wilshire Blvd, Los Angeles, CA 90036", "lat": 34.061605, "lon": -118.361178, "stalls": 8, "kw": 325, "facility": "Petersen Automotive Museum", "opened": null, "otherEVs": true, "source": "https://supercharge.info/map?siteID=7327"}];
const SCORE_COLORS = {4:'#93C47D',3:'#6FA8DC',2:'#FFD966',1:'#E06666',0:'#D9D9D9'};
const SCORE_LABELS = {4:'4 of 4',3:'3 of 4',2:'2 of 4',1:'1 of 4',0:'0 of 4'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const map = L.map('map', {zoomControl:true}).setView([34.02, -118.44], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

}).addTo(map);

const bounds = [];
LISTINGS.forEach(d => {
  const bg = d.color;
  const cls = d.status === 'removed' ? 'tag removed' : 'tag';
  const icon = L.divIcon({
    className:'',
    html:`<div class="${cls}" style="background:${bg};border-top-color:${bg}">${esc(d.price)}</div>`,
    iconSize:[0,0], iconAnchor:[0,0], popupAnchor:[0,-28]
  });
  const featLine = d.features.length
    ? `<div class="feats"><b>Has:</b> ${d.features.map(esc).join(', ')}</div>`
    : `<div class="feats"><b>Has:</b> none of the 4</div>`;
  const missing = ['Dishwasher','In-unit laundry','Gym','EV charger'].filter(f => !d.features.includes(f));
  const missLine = missing.length && d.status!=='removed'
    ? `<div class="feats" style="color:#666"><b>Missing:</b> ${missing.map(esc).join(', ')}</div>` : '';

    ['Sq ft', d.sqft], ['Dishwasher', d.dish], ['Laundry', d.laundry], ['Gym', d.gym],
    ['Pets', d.pets], ['Parking', d.parking],
    ['8:30am to Roxbury', d.toRox], ['5pm from Roxbury', d.fromRox],
    ['Rideshare est.', d.rideshare],
    ['Housing all-in', d.housing ? d.housing + '/mo' : ''],
    ['Total est.', d.total ? d.total + '/mo' : '']
  ].map(([k,v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
  const badgeLabel = d.status==='removed' ? 'Off the market' : `Score ${d.scoreLabel}`;
  const badgeCls = d.status==='removed' ? 'badge removed' : 'badge';
  const html = `<div class="pop">
      <span class="${badgeCls}" style="background:${bg}">${badgeLabel}</span>
      <h3>${esc(d.name)}</h3><div class="addr">${esc(d.address)}</div>
      <div class="price">${esc(d.price)}/mo</div>
      ${featLine}${missLine}
      <table>${rows}</table>
      <a class="btn" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">View listing &#8599;</a></div>`;
  const z = d.status==='removed' ? 100 : 200 + d.score*10;
  L.marker([d.lat, d.lon], {icon, zIndexOffset:z, title:d.name, riseOnHover:true})
    .addTo(map).bindPopup(html, {maxWidth: Math.min(300, window.innerWidth - 50), autoPanPadding:[15,15]});
  if (d.status !== 'removed') bounds.push([d.lat, d.lon]);
});

REFS.forEach(r => {
  const icon = L.divIcon({className:'', html:`<div class="ref"><b>&#9733;</b>${esc(r.label)}</div>`, iconSize:[0,0], iconAnchor:[0,0]});
  L.marker([r.lat, r.lon], {icon, zIndexOffset:1000, title:r.full}).addTo(map)
    .bindPopup(`<div class="pop"><h3>&#9733; ${esc(r.label)}</h3><div class="addr">${esc(r.full)}</div></div>`);
});
bounds.push([REFS[0].lat, REFS[0].lon]);
map.fitBounds(bounds, {padding: window.innerWidth < 600 ? [45,45] : [30,30]});

const STATUS_LABEL = {OPEN:'Open', CONSTRUCTION:'Under construction', PERMIT:'Planned (permit filed)', PLAN:'Planned'};
const scOpen = L.layerGroup(), scPlanned = L.layerGroup();
SUPERCHARGERS.forEach(s => {
  const open = s.status === 'OPEN';
  const icon = L.divIcon({className:'', html:`<div class="sc${open?'':' planned'}">&#9889;&#xFE0F;</div>`, iconSize:[0,0], iconAnchor:[0,0], popupAnchor:[0,-12]});
  const dir = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}`;
  const rows = [
    ['Status', STATUS_LABEL[s.status] || s.status],
    ['Stalls', s.stalls || 'Not listed'],
    ['Max power', s.kw ? s.kw + ' kW' : 'Not listed'],
    ['Location', s.facility || ''],
    ['Non-Tesla EVs', s.otherEVs ? 'Yes' : '']
  ].filter(r => r[1] !== '' && r[1] != null).map(([k,v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
  const html = `<div class="pop"><h3>&#9889; ${esc(s.name)}</h3><div class="addr">${esc(s.address)}</div>
      <table>${rows}</table>
      <a class="btn" href="${esc(dir)}" target="_blank" rel="noopener noreferrer">Directions &#8599;</a></div>`;
  L.marker([s.lat, s.lon], {icon, zIndexOffset: open ? 50 : 20, title: s.name})
    .bindPopup(html, {maxWidth: Math.min(280, window.innerWidth - 50), autoPanPadding:[15,15]})
    .addTo(open ? scOpen : scPlanned);
});
scOpen.addTo(map);
const nOpen = SUPERCHARGERS.filter(s => s.status === 'OPEN').length;
const overlays = {[`&#9889; Tesla Superchargers (${nOpen})`]: scOpen};
if (SUPERCHARGERS.length > nOpen) overlays[`&#9889; Planned Superchargers (${SUPERCHARGERS.length - nOpen})`] = scPlanned;
L.control.layers(null, overlays, {position:'topright', collapsed:false}).addTo(map);

const legend = L.control({position:'bottomleft'});
legend.onAdd = () => {
  const el = L.DomUtil.create('div','legend');
  let lines = `<div class="t">Apartment shortlist (50)</div>`;
  [4,3,2,1,0].forEach(s => {
    const n = LIVE_SCORES[String(s)] || 0;
    if (s === 0 && n === 0) return;
    if (s > 0 || n > 0) lines += `<div><span class="sw" style="background:${SCORE_COLORS[s]}"></span>${SCORE_LABELS[s]} (${n})</div>`;
  });
  lines += `<div><span class="sw" style="background:#6b6b6b"></span>Off the market (${REMOVED_N})</div>`;
  lines += `<div><span style="color:#1a237e;font-weight:700">&#9733;</span> Work: Roxbury, VNY</div>`;
  if (SUPERCHARGERS.length) lines += `<div><span class="sc" style="display:inline-flex;transform:none;width:14px;height:14px;font-size:9px;border-width:1px;vertical-align:-3px;margin-right:4px">&#9889;</span>Tesla Supercharger</div>`;
  lines += `<div style="color:#666">Tap a price for details</div>`;
  el.innerHTML = lines;
  L.DomEvent.disableClickPropagation(el);
  return el;
};
legend.addTo(map);
</script>
